# Job Coherence OS unit + fixture smoke (oilfield dual-gate transfer).
# QC pin locked. Never ROP score-chase. Never lambda=gamma.
name: job-coherence

on:
  workflow_dispatch:
  push:
    paths:
      - "job_coherence.py"
      - "realm_menu.py"
      - "realm/job_os/**"
      - "realm/kb_geometry/**"
      - "realm/dynamical_topology/**"
      - "realm/menu/**"
      - "tests/test_job_coherence*.py"
      - "tests/test_job_os_*.py"
      - "tests/test_kb_geometry*.py"
      - "tests/test_trend_rollup.py"
      - "tests/test_dynamical_topology*.py"
      - "tests/test_realm_menu.py"
      - "tests/fixtures/mini_*.las"
      - "tests/fixtures/mini_micropulse*"
      - "tests/fixtures/mini_survey.csv"
      - "docs/examples/job_rotation*.manifest.json"
      - ".github/workflows/job-coherence.yml"

jobs:
  job-os:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          if [ -f requirements-handoff.txt ]; then pip install -r requirements-handoff.txt || true; fi
      - name: Unit tests (job OS + kb_geometry + dynamical topology)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_job_coherence_core.py \
                 tests/test_job_coherence_micropulse.py \
                 tests/test_job_coherence_survey.py \
                 tests/test_job_coherence_regime.py \
                 tests/test_job_coherence_eow.py \
                 tests/test_job_os_firewall.py \
                 tests/test_job_os_rotation.py \
                 tests/test_job_os_aliases.py \
                 tests/test_job_os_catalog.py \
                 tests/test_kb_geometry.py \
                 tests/test_kb_geometry_p3p6.py \
                 tests/test_kb_geometry_h1.py \
                 tests/test_trend_rollup.py \
                 tests/test_dynamical_topology_types.py \
                 tests/test_dynamical_topology_engine.py \
                 tests/test_dynamical_topology_job.py \
                 tests/test_dynamical_topology_control.py \
                 tests/test_dynamical_topology_crit_handoff.py \
                 tests/test_realm_menu.py \
                 -q --tb=line
      - name: Fixture OS smoke + catalog + FIREWALL
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python job_coherence.py --os \
            --las tests/fixtures/mini_edr.las \
            --channel-pack surface_min \
            --regime-mode persist_h0 --with-regime --with-science \
            --chunk-rows 8 --max-chunks 4 \
            --stability-k 1 --max-rounds 3 \
            --out-dir /tmp/job_os_ci --run-id ci_smoke
          python job_coherence.py --catalog --out-dir /tmp/job_os_ci
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/job_os_ci/ci_smoke")
          coh = json.loads((root / "COHERENCE.json").read_text())
          assert coh.get("solved") is True, coh.get("stop_reason")
          assert (root / "PARTNER_RECIPE.json").is_file()
          assert (root / "TREND_ROLLUP.json").is_file()
          assert (root / "FIREWALL.json").is_file(), "FIREWALL.json missing"
          fw = json.loads((root / "FIREWALL.json").read_text())
          assert fw.get("pin_writable") is False
          assert fw.get("certified") is True, fw.get("near_miss")
          assert coh.get("firewall_certified") is True
          cat = json.loads(Path("/tmp/job_os_ci/INDEX.json").read_text())
          assert cat.get("n_runs", 0) >= 1
          assert cat.get("not_acceptance") is True
          # catalog should surface firewall when present
          rows = cat.get("runs") or []
          assert any(r.get("has_firewall") or r.get("firewall_certified") for r in rows)
          print("job-coherence smoke OK", coh.get("final_params"), "runs", cat.get("n_runs"))
          PY
      - name: Fixture multi-well rotation (ROTATION_PASS)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python job_coherence.py \
            --rotation docs/examples/job_rotation_fixture.manifest.json \
            --out-dir /tmp/rotation_ci
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/rotation_ci")
          batches = sorted([p for p in root.iterdir() if p.is_dir()])
          assert batches, "no rotation batch dir"
          report = json.loads((batches[-1] / "ROTATION_REPORT.json").read_text())
          assert report.get("branch") == "ROTATION_PASS", report
          assert report.get("pin_identical_across_wells") is True
          assert report.get("pin_writable") is False
          cls = report.get("classification") or {}
          assert cls.get("n_firewall_certified") == 2
          assert cls.get("n_wells") == 2
          print("rotation_ci_ok", report.get("batch_id"), report.get("branch"))
          print("job-coherence CI OK")
          PY
      - name: Upload job OS CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-os-ci
          path: |
            /tmp/job_os_ci/
            /tmp/rotation_ci/
          if-no-files-found: ignore
          retention-days: 14
