# Dual-gate handoff smoke (does not change ranking policy).
name: handoff

on:
  push:
    paths:
      - "realm/handoff/**"
      - "realm/validate/pdb_write.py"
      - "realm/validate/length_policy.py"
      - "handoff_export.py"
      - "handoff_campaign.py"
      - "handoff_verify.py"
      - "handoff_release.py"
      - "handoff_matrix.py"
      - "handoff_status.py"
      - "handoff_accept.py"
      - "handoff_deliver.py"
      - "handoff_ship.py"
      - "tests/test_handoff*.py"
      - "tests/test_pdb_write.py"
      - ".github/workflows/handoff.yml"
  pull_request:
    paths:
      - "realm/handoff/**"
      - "realm/validate/pdb_write.py"
      - "realm/validate/length_policy.py"
      - "handoff_export.py"
      - "handoff_campaign.py"
      - "handoff_verify.py"
      - "handoff_release.py"
      - "handoff_matrix.py"
      - "handoff_status.py"
      - "handoff_accept.py"
      - "handoff_deliver.py"
      - "handoff_ship.py"
      - "tests/test_handoff*.py"
      - "tests/test_pdb_write.py"
      - ".github/workflows/handoff.yml"

jobs:
  handoff-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          # BioPython optional — open check skips if missing; install for full metric
          pip install biopython || true
      - name: Handoff + PDB write suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_pdb_write.py tests/test_handoff.py tests/test_handoff_pipeline.py \
            tests/test_handoff_structure.py tests/test_handoff_package.py tests/test_handoff_verify.py \
            tests/test_handoff_release.py tests/test_handoff_matrix.py tests/test_handoff_status.py \
            tests/test_handoff_accept.py tests/test_handoff_deliver.py tests/test_handoff_ship.py \
            -q --tb=line
      - name: Dual-gate policy pin + verify CLI
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from realm.validate.length_policy import policy_for; p=policy_for(12,base_beta=0.20); assert abs(p.soft_T-0.036)<1e-12; assert p.seq_mix==0.0; print('dual-gate OK', p.soft_T)"
          python handoff_verify.py --pin-only
          python handoff_matrix.py --dry-run --tokens probe,holdout --out-root /tmp/handoff_matrix_dry
          mkdir -p /tmp/handoff_empty_releases
          python handoff_status.py --releases /tmp/handoff_empty_releases --report /tmp/handoff_status.json
      - name: BioPython open metric (1CSA commercial smoke)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          if importlib.util.find_spec("Bio") is None:
              print("BioPython not installed; skip require-biopython smoke")
              sys.exit(0)
          from handoff_campaign import main
          from realm.handoff.verify import verify_archive_dir

          rc = main([
              "--pdb-ids", "1CSA",
              "--out-dir", "/tmp/handoff_bio",
              "--package-dir", "/tmp/handoff_bio_pkg",
              "--top-k", "1",
              "--require-biopython",
              "--release-label", "ci-bio",
              "--archive",
              "--archive-dir", "/tmp/handoff_releases",
          ])
          if rc != 0:
              raise SystemExit(rc)
          latest = Path("/tmp/handoff_releases/LATEST.json")
          assert latest.is_file(), "LATEST.json missing"
          ptr = json.loads(latest.read_text())
          print("LATEST", ptr)
          av = verify_archive_dir(ptr["archive_dir"])
          print("archive_verify", av.get("ok"), av.get("n_checked"))
          acc = Path("/tmp/handoff_bio/ACCEPTANCE.json")
          assert acc.is_file(), "ACCEPTANCE.json missing"
          rec = json.loads(acc.read_text())
          print("ACCEPTANCE", rec.get("accepted"), rec.get("criteria", {}).get("openable_pdbs"))
          assert rec.get("accepted") is True
          from handoff_accept import main as accept_main
          arc = accept_main(["--latest", "--releases", "/tmp/handoff_releases"])
          if arc != 0:
              raise SystemExit(arc)
          # stage artifact dir for upload
          art = Path("/tmp/handoff_ci_artifact")
          art.mkdir(parents=True, exist_ok=True)
          import shutil
          shutil.copy2(acc, art / "ACCEPTANCE.json")
          shutil.copy2(Path("/tmp/handoff_bio/RELEASE.md"), art / "RELEASE.md")
          zp = Path(ptr.get("archive_dir") or "")
          for z in zp.glob("*.zip") if zp.is_dir() else []:
              shutil.copy2(z, art / z.name)
          for name in ("ARCHIVE.json", "ATTESTATION.json", "ACCEPT_REPORT.json"):
              src = Path(ptr["archive_dir"]) / name
              if src.is_file():
                  shutil.copy2(src, art / name)
          raise SystemExit(0 if av.get("ok") else 3)
          PY
      - name: Upload handoff CI package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dual-gate-handoff-ci-bio
          path: /tmp/handoff_ci_artifact/
          if-no-files-found: ignore
          retention-days: 14
